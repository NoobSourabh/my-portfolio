name: Site heartbeat

on:
  schedule:
    # Every 6 hours — keeps the deploy warm without burning Netlify credits.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set — add your Netlify URL in GitHub repo Settings → Secrets."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            "${SITE_URL%/}/api/heartbeat"

          echo ""
          echo "Heartbeat OK at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
